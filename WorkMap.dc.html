<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ sectionRef }}" data-workmap="1" style="position:relative;height:{{ rootH }};display:grid;grid-template-columns:{{ cols }};column-gap:32px;row-gap:56px;align-items:center;">
  <svg style="position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0;">
    <defs>
      <filter id="wm-line-noise" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <feTurbulence data-noise="1" type="fractalNoise" baseFrequency="0.115" numOctaves="3" seed="8023" stitchTiles="stitch" result="noise"></feTurbulence>
        <feColorMatrix in="noise" type="luminanceToAlpha" result="lum"></feColorMatrix>
        <feComponentTransfer in="lum" result="mask">
          <feFuncA type="discrete" tableValues="1 0.22"></feFuncA>
        </feComponentTransfer>
        <feComposite in="SourceGraphic" in2="mask" operator="in"></feComposite>
      </filter>
    </defs>
    <g filter="url(#wm-line-noise)">
      <sc-for list="{{ edges }}" as="e" hint-placeholder-count="0">
        <line data-edge="{{ $index }}" x1="0" y1="0" x2="0" y2="0" stroke="rgba(255,255,255,0.82)" stroke-width="1"></line>
      </sc-for>
    </g>
  </svg>

  <div data-role="col-left" style="min-width:0;position:relative;z-index:2;">
    <div ref="{{ leftWrap }}" style="position:relative;width:100%;height:602px;transform-origin:50% 50%;">
      <div data-stage="left" style="position:absolute;left:0;top:0;width:380px;height:602px;transform-origin:0 0;">
        <div style="position:absolute;left:-140px;top:-80px;right:-140px;bottom:-80px;pointer-events:none;background:radial-gradient(closest-side, rgba(214,86,46,0.20), rgba(214,86,46,0.07) 60%, rgba(214,86,46,0) 100%);"></div>
        <sc-for list="{{ leftBoxes }}" as="b" hint-placeholder-count="5">
          <div data-node="{{ b.i }}" style="position:absolute;left:{{ b.x }}px;top:{{ b.y }}px;width:120px;height:120px;will-change:transform;">
            <div data-hud-screen="1" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%, #1e0b06 0%, #180905 80%);border:1px solid #d95a34;box-shadow:0 0 24px rgba(217,90,52,0.38), inset 0 0 18px rgba(217,90,52,0.12);">
              <img src="{{ b.logo }}" alt="{{ b.name }}" style="display:block;width:{{ b.w }}px;height:auto;max-width:{{ b.mw }}px;mix-blend-mode:lighten;filter:{{ b.fx }};-webkit-mask-image:{{ b.mask }};mask-image:{{ b.mask }};">
            </div>
            <div data-wm-label="{{ b.i }}" style="position:absolute;left:{{ b.lx }}px;top:{{ b.ly }}px;padding:2px;">
              <div data-lb-fill="1" aria-hidden="true" style="position:absolute;inset:0;z-index:2;background:#c44a25;opacity:0;transform:scale(0);transform-origin:50% 50%;pointer-events:none;"></div>
              <svg data-lb-c="1" width="100%" height="100%" preserveAspectRatio="none" style="position:absolute;inset:0;overflow:visible;opacity:0;">
                <rect x="0.5" y="0.5" width="calc(100% - 1px)" height="calc(100% - 1px)" fill="none" stroke="#df5227" stroke-width="1" pathLength="100" stroke-dasharray="24.6 2.3 16.8 0.8 33.3 3 15.3 0.5 3.4"></rect>
              </svg>
              <div data-lb-c="1" style="position:relative;opacity:0;overflow:hidden;background:#c44a25;box-shadow:inset 0 0 0 1px rgba(255,190,160,0.22);padding:9px 14px;white-space:nowrap;color:#dcd1cb;font-family:'Redaction 10','Redaction',Georgia,serif;font-weight:700;font-size:15px;line-height:20px;letter-spacing:0.01em;">
                <div style="position:absolute;inset:0;background-image:url(assets/noise-dark.svg);background-size:200px 200px;opacity:0.35;pointer-events:none;"></div>
                <span style="position:relative;">{{ b.label }}</span>
              </div>
            </div>
            <div data-hud-boot="1" data-w="120" data-h="120" aria-hidden="true" style="position:absolute;left:0;top:0;width:120px;height:120px;pointer-events:none;z-index:3;">
              <div data-hud-fill="1" style="position:absolute;inset:0;background:#D9D9D9;opacity:0;transform-origin:50% 50%;"></div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div data-role="col-center" aria-hidden="true" style="display:{{ centerDisplay }};"></div>

  <div data-role="col-right" style="min-width:0;position:relative;z-index:2;">
    <div ref="{{ rightWrap }}" style="position:relative;width:100%;height:602px;transform-origin:50% 50%;">
      <div data-stage="right" style="position:absolute;left:0;top:0;width:380px;height:602px;transform-origin:0 0;">
        <div style="position:absolute;left:-140px;top:-80px;right:-140px;bottom:-80px;pointer-events:none;background:radial-gradient(closest-side, rgba(214,86,46,0.20), rgba(214,86,46,0.07) 60%, rgba(214,86,46,0) 100%);"></div>
        <sc-for list="{{ rightBoxes }}" as="b" hint-placeholder-count="4">
          <div data-node="{{ b.i }}" style="position:absolute;left:{{ b.x }}px;top:{{ b.y }}px;width:120px;height:120px;will-change:transform;">
            <div data-hud-screen="1" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%, #1e0b06 0%, #180905 80%);border:1px solid #d95a34;box-shadow:0 0 24px rgba(217,90,52,0.38), inset 0 0 18px rgba(217,90,52,0.12);">
              <img src="{{ b.logo }}" alt="{{ b.name }}" style="display:block;width:{{ b.w }}px;height:auto;max-width:{{ b.mw }}px;mix-blend-mode:lighten;filter:{{ b.fx }};-webkit-mask-image:{{ b.mask }};mask-image:{{ b.mask }};">
            </div>
            <div data-wm-label="{{ b.i }}" style="position:absolute;left:{{ b.lx }}px;top:{{ b.ly }}px;padding:2px;">
              <div data-lb-fill="1" aria-hidden="true" style="position:absolute;inset:0;z-index:2;background:#c44a25;opacity:0;transform:scale(0);transform-origin:50% 50%;pointer-events:none;"></div>
              <svg data-lb-c="1" width="100%" height="100%" preserveAspectRatio="none" style="position:absolute;inset:0;overflow:visible;opacity:0;">
                <rect x="0.5" y="0.5" width="calc(100% - 1px)" height="calc(100% - 1px)" fill="none" stroke="#df5227" stroke-width="1" pathLength="100" stroke-dasharray="24.6 2.3 16.8 0.8 33.3 3 15.3 0.5 3.4"></rect>
              </svg>
              <div data-lb-c="1" style="position:relative;opacity:0;overflow:hidden;background:#c44a25;box-shadow:inset 0 0 0 1px rgba(255,190,160,0.22);padding:9px 14px;white-space:nowrap;color:#dcd1cb;font-family:'Redaction 10','Redaction',Georgia,serif;font-weight:700;font-size:15px;line-height:20px;letter-spacing:0.01em;">
                <div style="position:absolute;inset:0;background-image:url(assets/noise-dark.svg);background-size:200px 200px;opacity:0.35;pointer-events:none;"></div>
                <span style="position:relative;">{{ b.label }}</span>
              </div>
            </div>
            <div data-hud-boot="1" data-w="120" data-h="120" aria-hidden="true" style="position:absolute;left:0;top:0;width:120px;height:120px;pointer-events:none;z-index:3;">
              <div data-hud-fill="1" style="position:absolute;inset:0;background:#D9D9D9;opacity:0;transform-origin:50% 50%;"></div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const LEFT = [
  { name: 'Genie AI', label: 'AI SaaS Consulting', svg: true, logo: 'assets/logos/genie-ai.svg', w: 120, ow: 92, x: 60, y: 54, lx: -59, ly: -22 },
  { name: 'Open Library', label: 'Open Source Digital library', svg: true, logo: 'assets/logos/open-library.svg', w: 120, ow: 108, x: 239, y: 122, lx: -13, ly: -42 },
  { name: 'PAC Group', label: 'AI SaaS Consulting', logo: 'assets/logos/pac.png', w: 108, x: 4, y: 265, lx: 30, ly: -30 },
  { name: 'OmniSynk AI', label: 'Resource Management', logo: 'assets/logos/omnisynk.png', w: 106, x: 324, y: 287, lx: -13, ly: -28 },
  { name: "L'Oréal", label: 'Hackathon', svg: true, logo: 'assets/logos/loreal.svg', w: 120, ow: 108, x: 151, y: 447, lx: -34, ly: -22 }
];
const RIGHT = [
  { name: 'THEM Consulting', label: 'Fintech Agency', svg: true, logo: 'assets/logos/them-consulting.svg', w: 120, ow: 104, x: 80, y: 52, lx: 41, ly: -24 },
  { name: 'IndiaBonds', label: 'Bond Market', logo: 'assets/logos/indiabonds.png', w: 106, x: -48, y: 253, lx: 38, ly: -24 },
  { name: 'WealthDesk', label: 'Investment Marketplace', svg: true, logo: 'assets/logos/wealthdesk.svg', w: 120, ow: 108, x: 253, y: 257, lx: -13, ly: -22 },
  { name: 'PayTM', label: 'Fintech', svg: true, logo: 'assets/logos/paytm.svg', w: 120, ow: 104, x: 169, y: 446, lx: -32, ly: -20 }
];
const NODES = LEFT.map(b => ({ ...b, side: 'left' })).concat(RIGHT.map(b => ({ ...b, side: 'right' })));
// 0 Genie, 1 OpenLib, 2 PAC, 3 Omni, 4 L'Oréal | 5 THEM, 6 IndiaBonds, 7 WealthDesk, 8 PayTM
const EDGES = [
  [0,1],[0,2],[0,3],[0,4],[1,2],[1,3],[1,4],[2,3],[2,4],[3,4],
  [5,6],[5,7],[5,8],[6,7],[6,8],[7,8],
  [1,5],[1,6],[1,7],[3,5],[3,6],[3,8],[4,6],[4,8],[0,5],[2,6]
];
const HALF = 60;
// Sprouting: each side starts at the card nearest the centre column. Wave 1 is one wire to its nearest neighbour; each
// following wave adds one more wire, sprouting from the cards the last wave reached, until the side is fully meshed.
// Side waves share the first SIDE_SPAN of the scrub; the cross-links joining the two maps draw in the rest.
const STARTS = [3, 6], SIDE_SPAN = 0.8;
// PULL_LAG: share of the pull by which the farthest card trails the nearest one.
const PULL_LAG = 0.45;
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const PLAN = (() => {
  const plan = EDGES.map(() => null), key = (a, b) => (a < b ? a + '-' + b : b + '-' + a), idx = {};
  EDGES.forEach(([a, b], k) => (idx[key(a, b)] = k));
  const dist = (a, b) => Math.hypot(NODES[a].x - NODES[b].x, NODES[a].y - NODES[b].y);
  STARTS.forEach(start => {
    const side = NODES[start].side, nodes = NODES.map((n, i) => i).filter(i => NODES[i].side === side);
    const sideEdges = EDGES.map((_, k) => k).filter(k => nodes.includes(EDGES[k][0]) && nodes.includes(EDGES[k][1]));
    const used = new Set(), reached = new Set([start]), waves = []; let frontier = [start];
    for (let w = 1; used.size < sideEdges.length && w < 20; w++) {
      const wave = [], next = [], taken = k => used.has(k) || wave.some(x => x.k === k);
      for (let j = 0; j < w && used.size + wave.length < sideEdges.length; j++) {
        let best = null;
        const r = j % frontier.length, srcs = frontier.slice(r).concat(frontier.slice(0, r));
        for (const s of srcs) {
          for (const t of nodes) {
            if (reached.has(t) || next.includes(t)) continue;
            const k = idx[key(s, t)]; if (k === undefined || taken(k)) continue;
            const d = dist(s, t); if (!best || d < best.d) best = { s, t, k, d };
          }
          if (best) break;
        }
        if (!best) for (const k of sideEdges) {
          if (taken(k)) continue;
          const [a, b] = EDGES[k], s = frontier.includes(b) ? b : a, t = s === a ? b : a, d = dist(a, b);
          if (!best || d < best.d) best = { s, t, k, d };
        }
        if (!best) break;
        wave.push(best); if (!reached.has(best.t) && !next.includes(best.t)) next.push(best.t);
      }
      wave.forEach(x => used.add(x.k)); next.forEach(t => reached.add(t));
      frontier = next.length ? next : Array.from(reached);
      waves.push(wave);
    }
    waves.forEach((wv, i) => wv.forEach(x => (plan[x.k] = { a: x.s, b: x.t, s0: SIDE_SPAN * i / waves.length, s1: SIDE_SPAN * (i + 1) / waves.length })));
  });
  EDGES.forEach(([a, b], k) => { if (!plan[k]) plan[k] = { a, b, s0: SIDE_SPAN, s1: 1 }; });
  return plan;
})();
const GLOW = 'drop-shadow(0 0 4px rgba(255,236,226,0.55)) drop-shadow(0 0 10px rgba(255,120,80,0.35))';
const FADE = 'radial-gradient(ellipse 50% 50% at 50% 50%, #000 84%, transparent 100%)';
const look = (b, side) => b.svg
  ? { mw: 120, fx: GLOW, mask: 'none' }
  : { mw: 108, fx: side === 'right' ? 'contrast(1.7) brightness(0.85)' : 'none', mask: FADE };

class Component extends DCLogic {
  sectionRef = React.createRef();
  leftWrap = React.createRef();
  rightWrap = React.createRef();

  // Wires are scroll-scrubbed by window.__wmSprout (0..1, written by the hero; absent = fully drawn). Card boot-in is run by the hero.
  componentDidMount() {
    const pos = NODES.map(() => ({ x: 0, y: 0 }));
    const fit = sec => {
      const sr = sec.getBoundingClientRect(), zf = (sr.width / (sec.offsetWidth || 1)) || 1;
      const geo = {};
      for (const side of ['left', 'right']) {
        const stage = sec.querySelector('[data-stage="' + side + '"]');
        const wrap = stage && stage.parentElement;
        if (!wrap) return null;
        const w = wrap.clientWidth;
        if (!w) return null;
        const boxes = side === 'left' ? LEFT : RIGHT;
        const minX = Math.min(...boxes.map(b => b.x)), maxX = Math.max(...boxes.map(b => b.x + 120));
        const bw = maxX - minX, s = Math.min(this.props.narrow ? 1 : 1.12, w / bw), tx = (w - bw * s) / 2 - minX * s;
        const tf = 'translate(' + tx.toFixed(2) + 'px,0) scale(' + s.toFixed(4) + ')';
        if (stage.style.transform !== tf) stage.style.transform = tf;
        const hh = (602 * s).toFixed(2) + 'px';
        if (wrap.style.height !== hh) wrap.style.height = hh;
        const wr = wrap.getBoundingClientRect();
        geo[side] = { s, ox: (wr.left - sr.left) / zf + tx, oy: (wr.top - sr.top) / zf };
      }
      geo.key = sr.width.toFixed(1) + ',' + geo.left.ox.toFixed(1) + ',' + geo.right.ox.toFixed(1) + ',' + geo.left.s;
      return geo;
    };
    const seg = (p, a, b) => clamp01((p - a) / (b - a));
    const ease = t => t * t * (3 - 2 * t);
    let lastKey = '';
    const tick = now => {
      this.raf = requestAnimationFrame(tick);
      let sec = this.sectionRef.current;
      if (!sec || !sec.isConnected) sec = document.querySelector('[data-workmap]');
      if (!sec) return;
      if (now - (this.lastSeed || 0) > 140) {
        this.lastSeed = now;
        const tn = sec.querySelector('[data-noise]');
        if (tn) tn.setAttribute('seed', String(8023 + Math.floor(now / 140) % 24));
      }
      const geo = fit(sec);
      if (!geo) return;
      this.animLabels(sec, now);
      const P = typeof window.__wmSprout === 'number' ? window.__wmSprout : 1;
      const PU = typeof window.__wmPull === 'number' ? window.__wmPull : 0;
      const key = P.toFixed(4) + '|' + PU.toFixed(4) + '|' + geo.key;
      if (key === lastKey) return;
      lastKey = key;
      // Pull (section 2 → 3): the wires reel every card in to the centre, behind the middle screen. Nearest cards go first.
      const C = { x: sec.offsetWidth / 2, y: sec.offsetHeight / 2 };
      NODES.forEach((n, i) => { const g = geo[n.side]; pos[i].x = g.ox + (n.x + HALF) * g.s; pos[i].y = g.oy + (n.y + HALF) * g.s; });
      if (!this.pullDelay) {
        const order = NODES.map((_, i) => i).sort((a, b) => Math.hypot(pos[a].x - C.x, pos[a].y - C.y) - Math.hypot(pos[b].x - C.x, pos[b].y - C.y));
        this.pullDelay = []; order.forEach((i, r) => (this.pullDelay[i] = PULL_LAG * r / (order.length - 1)));
      }
      const pk = NODES.map((_, i) => { const t = clamp01((PU - this.pullDelay[i]) / (1 - PULL_LAG)); return t * t * t; });
      sec.querySelectorAll('[data-node]').forEach(el => {
        const i = +el.getAttribute('data-node'), k = pk[i] || 0, g = geo[NODES[i].side];
        const tf = k > 0 ? 'translate(' + ((C.x - pos[i].x) * k / g.s).toFixed(2) + 'px,' + ((C.y - pos[i].y) * k / g.s).toFixed(2) + 'px) scale(' + (1 - 0.4 * k).toFixed(4) + ')' : '';
        if (el.style.transform !== tf) el.style.transform = tf;
      });
      NODES.forEach((_, i) => { const k = pk[i]; if (k > 0) { pos[i].x += (C.x - pos[i].x) * k; pos[i].y += (C.y - pos[i].y) * k; } });
      // a card's label switches on once a wire touching it has fully connected
      const linked = new Set();
      if (PU <= 0.02) PLAN.forEach(pl => { if (pl && P >= pl.s1) { linked.add(pl.a); linked.add(pl.b); } });
      this.labelWant = linked;
      sec.querySelectorAll('[data-edge]').forEach(ln => {
        const pl = PLAN[+ln.getAttribute('data-edge')]; if (!pl) return;
        const f = ease(seg(P, pl.s0, pl.s1)), A = pos[pl.a], B = pos[pl.b];
        ln.style.visibility = f <= 0 ? 'hidden' : '';
        ln.setAttribute('x1', A.x.toFixed(2)); ln.setAttribute('y1', A.y.toFixed(2));
        ln.setAttribute('x2', (A.x + (B.x - A.x) * f).toFixed(2)); ln.setAttribute('y2', (A.y + (B.y - A.y) * f).toFixed(2));
      });
    };
    this.raf = requestAnimationFrame(tick);
  }

  // Label boot mirrors the card boot: a grey fill scales out from the centre, flashes off, then the label flickers on.
  // Closing plays it in reverse (flicker off, fill flashes and collapses).
  animLabels(sec, now) {
    const want = this.labelWant || new Set(), st = (this.lbState = this.lbState || {});
    const H = window.HUDMotion, C = H && H.CONFIG && H.CONFIG.boot, S = (C && C.scaleDur) || 420;
    const reduced = (H && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const ease = t => 1 - Math.pow(1 - t, 3), kf = (k, t) => { for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1] = k[i]; return v0 + (v1 - v0) * ((t - t0) / (t1 - t0 || 1)); } return k[k.length - 1][1]; };
    const ON = [[0, 0], [40, 1], [80, 0.3], [140, 1]], OFF = [[0, 1], [40, 0.3], [80, 1], [140, 0], [170, 0.5], [200, 0]];
    sec.querySelectorAll('[data-wm-label]').forEach(el => {
      const i = +el.getAttribute('data-wm-label'), on = want.has(i);
      let o = st[i]; if (!o || o.el !== el) { o = st[i] = { el, on: false, t0: -1e9, fill: el.querySelector('[data-lb-fill]'), cs: Array.from(el.querySelectorAll('[data-lb-c]')) }; }
      if (on !== o.on) { o.on = on; o.t0 = now; }
      const t = now - o.t0;
      let fs = 0, fo = 0, co;
      if (reduced) co = on ? Math.min(1, t / 150) : Math.max(0, 1 - t / 150);
      else if (on) {
        if (t < S) { fs = ease(t / S); fo = kf([[0, 0], [S * 0.4, 0.25], [S * 0.8, 0.6], [S - 40, 1], [S, 1]], t); co = 0; }
        else co = kf(ON, t - S);
      } else {
        co = kf(OFF, t);
        if (t > 160 && t < 160 + S) { const k = t - 160; fs = 1 - ease(k / S); fo = kf([[0, 0], [S * 0.4, 0.6], [S - 40, 1], [S, 0]], k); }
      }
      const fsv = 'scale(' + fs.toFixed(4) + ')', fov = fo.toFixed(3), cov = co.toFixed(3);
      if (o.fill && o.fill.style.transform !== fsv) { o.fill.style.transform = fsv; o.fill.style.opacity = fov; } else if (o.fill) o.fill.style.opacity = fov;
      o.cs.forEach(c => { if (c.style.opacity !== cov) c.style.opacity = cov; });
    });
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
  }

  renderVals() {
    return {
      sectionRef: this.sectionRef,
      rootH: this.props.narrow ? 'auto' : '100%',
      cols: this.props.narrow ? 'minmax(0,1fr)' : '500px 561px 500px',
      centerDisplay: this.props.narrow ? 'none' : 'block',
      leftWrap: this.leftWrap,
      rightWrap: this.rightWrap,
      leftBoxes: LEFT.map((b, i) => ({ ...b, ...look(b, 'left'), i })),
      rightBoxes: RIGHT.map((b, i) => ({ ...b, ...look(b, 'right'), i: i + LEFT.length })),
      edges: EDGES.map(([a, b]) => ({ a, b }))
    };
  }
}
</script>
</body>
</html>
