<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/* Fonts are declared once in index.html; re-declaring them here re-downloaded every face. */
@keyframes crtRoll{0%{transform:translateY(-110%)}100%{transform:translateY(420%)}}
</style>
</helmet>
<div data-cs-track="1" ref="{{ trackRef }}" style="position:relative;height:{{ trackHeight }};">
  <div style="position:{{ stickyPos }};top:{{ stickyTop }};height:{{ stickyHeight }};display:flex;align-items:center;">
    <div data-cs-card="1" style="position:relative;width:100%;display:flex;flex-direction:column;padding:0 1px 1px 0;color:#eeeeee;font-family:'Redaction 35','Redaction',Georgia,serif;">

      <div data-screen-label="Case Bar" data-cs-box="1" style="position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 25px;min-height:59px;padding:8px 16px 8px 17px;border:1px solid #929292;margin:0 -1px -1px 0;">
        <h2 data-anim="1" data-cs-title="1" style="margin:0;min-width:0;font-family:'Redaction 10','Redaction',Georgia,serif;font-weight:400;font-size:28px;line-height:32px;letter-spacing:0;color:#ffffff;text-wrap:balance;">{{ c.title }}</h2>
        <div style="display:flex;gap:8px;">
          <sc-for list="{{ c.tags }}" as="t" hint-placeholder-count="3">
            <span data-anim="1" data-cs-tag="1" style="position:relative;display:flex;padding:2px;">
              <svg preserveAspectRatio="none" style="position:absolute;left:0.5px;top:0.5px;width:calc(100% - 1px);height:calc(100% - 1px);overflow:visible;"><rect x="0" y="0" width="100%" height="100%" fill="none" stroke="#df5227" stroke-width="1" pathLength="100" stroke-dasharray="20.4 1.8 16.5 3 31 2.3 18.1 2.4 4.5"></rect></svg>
              <span style="position:relative;overflow:hidden;display:flex;align-items:center;height:37px;padding:0 10px;background:#df5227;color:#ffffff;font-family:'Redaction 70','Redaction',Georgia,serif;font-weight:700;font-size:14px;line-height:1;white-space:nowrap;">
                <span style="position:relative;">{{ t }}</span>
                <span style="position:absolute;inset:0;background-image:url(assets/noise-dark.svg);background-size:200px 200px;opacity:0.35;pointer-events:none;"></span>
              </span>
            </span>
          </sc-for>
        </div>
        <div aria-label="Case studies" data-cs-nav="1" style="position:relative;margin-left:auto;display:flex;gap:4px;padding:2px;">
          <sc-for list="{{ squares }}" as="sq" hint-placeholder-count="4">
            <button type="button" aria-label="{{ sq.label }}" aria-current="{{ sq.on }}" onClick="{{ sq.go }}" style="position:relative;width:24px;height:24px;padding:0;border:0;background:transparent;cursor:pointer;overflow:hidden;">
              <span style="position:absolute;inset:0;background:#d9d9d9;opacity:0.3;"></span>
              <span data-fill="{{ sq.i }}" style="position:absolute;inset:0;background:#d9d9d9;transform-origin:0 50%;transform:scaleX(0);"></span>
              <span style="position:absolute;inset:0;background-image:url(assets/noise-dark.svg);background-size:200px 200px;opacity:0.35;"></span>
            </button>
          </sc-for>
          <span aria-hidden="true" style="position:absolute;left:2px;top:2px;width:24px;height:24px;pointer-events:none;transform:translateX({{ bracketX }});transition:transform 520ms cubic-bezier(.2,.8,.2,1);">
            <span style="position:absolute;left:-2px;top:-2px;width:8px;height:8px;border-top:1px solid #ffffff;border-left:1px solid #ffffff;"></span>
            <span style="position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-bottom:1px solid #ffffff;border-right:1px solid #ffffff;"></span>
          </span>
        </div>
      </div>

      <div style="display:flex;flex-wrap:wrap;">
        <div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;">

          <div data-screen-label="Goals" data-cs-box="1" data-cs-tree="1" style="position:relative;min-height:345px;padding:16px 16px 28px 15px;border:1px solid #929292;margin:0 -1px -1px 0;">
            <div data-anim="1" style="display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 6px 0 6px;background:#ffffff;color:#000000;font-size:20px;line-height:1;white-space:nowrap;">
              <svg width="20" height="18" viewBox="47 123 20 18" fill="none" style="flex:0 0 auto;"><path d="M48 126V136.8C48 137.92 48 138.48 48.218 138.908C48.4097 139.284 48.7155 139.59 49.0918 139.782C49.5192 140 50.079 140 51.1969 140H62.8031C63.921 140 64.48 140 64.9074 139.782C65.2837 139.59 65.5905 139.284 65.7822 138.908C66.0002 138.48 66.0002 137.92 66.0002 136.8L66.0002 129.2C66.0002 128.08 66.0002 127.52 65.7822 127.092C65.5905 126.715 65.2839 126.41 64.9076 126.218C64.4798 126 63.9201 126 62.8 126H57M48 126H57M48 126C48 124.895 48.8954 124 50 124H53.6745C54.1637 124 54.4089 124 54.639 124.055C54.8431 124.104 55.0379 124.185 55.2168 124.295C55.4186 124.419 55.5918 124.592 55.9375 124.938L57 126" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              <span>[Core] Goals</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;padding-left:24px;margin-top:8px;">
              <sc-for list="{{ c.goals }}" as="g" hint-placeholder-count="2">
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <div style="display:flex;"><div data-anim="1" style="display:inline-flex;align-items:flex-start;gap:10px;max-width:100%;min-height:34px;padding:4px 6px;border:1px solid #ffffff;font-size:20px;line-height:24px;">
                    <svg width="20" height="18" viewBox="47 123 20 18" fill="none" style="flex:0 0 auto;margin-top:3px;"><path d="M48 126V136.8C48 137.92 48 138.48 48.218 138.908C48.4097 139.284 48.7155 139.59 49.0918 139.782C49.5192 140 50.079 140 51.1969 140H62.8031C63.921 140 64.48 140 64.9074 139.782C65.2837 139.59 65.5905 139.284 65.7822 138.908C66.0002 138.48 66.0002 137.92 66.0002 136.8L66.0002 129.2C66.0002 128.08 66.0002 127.52 65.7822 127.092C65.5905 126.715 65.2839 126.41 64.9076 126.218C64.4798 126 63.9201 126 62.8 126H57M48 126H57M48 126C48 124.895 48.8954 124 50 124H53.6745C54.1637 124 54.4089 124 54.639 124.055C54.8431 124.104 55.0379 124.185 55.2168 124.295C55.4186 124.419 55.5918 124.592 55.9375 124.938L57 126" stroke="#eeeeee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    <span>{{ g.label }}</span>

                  <div style="display:flex;flex-direction:column;gap:8px;padding-left:24px;">

                        <sc-if value="{{ it.bridge }}" hint-placeholder-val="{{ false }}"><span data-line="1" style="position:absolute;left:-12px;top:-8px;bottom:-8px;width:1px;background:#ffffff;transform-origin:50% 0;"></span></sc-if>
                        <sc-if value="{{ it.end }}" hint-placeholder-val="{{ false }}"><span data-line="1" style="position:absolute;left:-12px;top:-8px;height:calc(50% + 9px);width:1px;background:#ffffff;transform-origin:50% 0;"></span></sc-if>
                        <span data-line="1" style="position:absolute;left:-12px;top:50%;width:12px;height:1px;background:#ffffff;transform-origin:0 50%;"></span>
                        <div data-anim="1" style="display:inline-flex;align-items:flex-start;gap:10px;max-width:100%;min-height:34px;padding:4px 6px;border:1px solid {{ it.stroke }};font-size:20px;line-height:24px;">
                          <svg width="20" height="18" viewBox="47 123 20 18" fill="none" style="flex:0 0 auto;margin-top:3px;"><path d="M48 126V136.8C48 137.92 48 138.48 48.218 138.908C48.4097 139.284 48.7155 139.59 49.0918 139.782C49.5192 140 50.079 140 51.1969 140H62.8031C63.921 140 64.48 140 64.9074 139.782C65.2837 139.59 65.5905 139.284 65.7822 138.908C66.0002 138.48 66.0002 137.92 66.0002 136.8L66.0002 129.2C66.0002 128.08 66.0002 127.52 65.7822 127.092C65.5905 126.715 65.2839 126.41 64.9076 126.218C64.4798 126 63.9201 126 62.8 126H57M48 126H57M48 126C48 124.895 48.8954 124 50 124H53.6745C54.1637 124 54.4089 124 54.639 124.055C54.8431 124.104 55.0379 124.185 55.2168 124.295C55.4186 124.419 55.5918 124.592 55.9375 124.938L57 126" stroke="#eeeeee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                          <span>{{ it.t }}</span>
                        </div>
                      </div>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>

          <div style="display:flex;flex-wrap:wrap;">
            <div data-screen-label="Outcomes" data-cs-box="1" data-cs-outcomes="1" style="position:relative;flex:1 1 300px;min-width:0;min-height:358px;padding:15px 15px 22px 15px;border:0.5px solid #ffffff;margin:0 -1px -1px 0;display:flex;flex-direction:column;">
              <div data-hud-set="A" style="display:flex;flex-direction:column;flex:1;">
              <div style="display:flex;"><div data-anim="1" data-rv="1" style="display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 6px;background:#ffffff;color:#000000;font-size:20px;line-height:1;white-space:nowrap;">
                <svg width="20" height="18" viewBox="47 123 20 18" fill="none" style="flex:0 0 auto;"><path d="M48 126V136.8C48 137.92 48 138.48 48.218 138.908C48.4097 139.284 48.7155 139.59 49.0918 139.782C49.5192 140 50.079 140 51.1969 140H62.8031C63.921 140 64.48 140 64.9074 139.782C65.2837 139.59 65.5905 139.284 65.7822 138.908C66.0002 138.48 66.0002 137.92 66.0002 136.8L66.0002 129.2C66.0002 128.08 66.0002 127.52 65.7822 127.092C65.5905 126.715 65.2839 126.41 64.9076 126.218C64.4798 126 63.9201 126 62.8 126H57M48 126H57M48 126C48 124.895 48.8954 124 50 124H53.6745C54.1637 124 54.4089 124 54.639 124.055C54.8431 124.104 55.0379 124.185 55.2168 124.295C55.4186 124.419 55.5918 124.592 55.9375 124.938L57 126" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <span data-rv="1" data-scr="1">[Core] Outcomes</span>
              </div></div>
              <div style="position:relative;margin-top:11px;">
              <div data-role="crt" data-hud-screen="1" style="position:relative;min-height:186px;overflow:hidden;background:rgba(217,217,217,0.3);">
                <div data-crt-content="1" style="position:relative;z-index:1;min-height:186px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 36px 26px;text-align:center;">
                  <div data-rv="1" data-scr="1" style="font-family:'Redaction 35','Redaction',Georgia,serif;font-size:80px;line-height:72px;letter-spacing:-0.01em;color:#ffffff;white-space:nowrap;text-shadow:0 0 1.5px rgba(255,255,255,0.65), 0 0 8px rgba(255,255,255,0.3);">{{ c.outcome.value }}</div>
                  <div data-rv="1" data-scr="1" style="font-family:'Redaction',Georgia,serif;font-size:18px;line-height:22px;color:#ffffff;text-wrap:balance;text-shadow:0 0 1.5px rgba(255,255,255,0.65), 0 0 8px rgba(255,255,255,0.3);">{{ c.outcome.caption }}</div>
                </div>
                <div aria-hidden="true" style="position:absolute;inset:0;z-index:2;pointer-events:none;background-image:repeating-linear-gradient(180deg, rgba(0,0,0,0.26) 0px, rgba(0,0,0,0.26) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);"></div>
                <canvas data-crt-noise="1" width="240" height="96" aria-hidden="true" style="position:absolute;inset:0;z-index:3;width:100%;height:100%;display:block;pointer-events:none;"></canvas>
                <div aria-hidden="true" data-crt-anim="1" style="position:absolute;left:0;right:0;top:0;height:18%;z-index:4;pointer-events:none;background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.045) 70%, rgba(255,255,255,0.08) 78%, rgba(255,255,255,0) 100%);animation:crtRoll 8.6s linear infinite;animation-delay:-2.2s;"></div>
                <div aria-hidden="true" style="position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.22), inset 0 0 12px rgba(0,0,0,0.3);"></div>
                <div aria-hidden="true" data-crt-flicker="1" style="position:absolute;inset:0;z-index:6;pointer-events:none;background:#000000;opacity:0;"></div>
                <div aria-hidden="true" data-crt-tear="1" style="position:absolute;left:0;right:0;top:40%;height:2px;z-index:6;pointer-events:none;background:rgba(255,255,255,0.5);opacity:0;"></div>
              </div>
              <div data-hud-boot="1" data-w="0" data-h="0" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:7;">
                <div data-hud-fill="1" style="position:absolute;inset:0;background:#D9D9D9;opacity:0;transform-origin:50% 50%;"></div>
                <span data-hud-arm="tl-h" style="position:absolute;left:0;top:0;width:20px;height:1px;background:#ffffff;transform-origin:0 0;"></span>
                <span data-hud-arm="tl-v" style="position:absolute;left:0;top:0;width:1px;height:20px;background:#ffffff;transform-origin:0 0;"></span>
                <span data-hud-arm="tr-h" style="position:absolute;right:0;top:0;width:20px;height:1px;background:#ffffff;transform-origin:100% 0;"></span>
                <span data-hud-arm="tr-v" style="position:absolute;right:0;top:0;width:1px;height:20px;background:#ffffff;transform-origin:100% 0;"></span>
                <span data-hud-arm="bl-h" style="position:absolute;left:0;bottom:0;width:20px;height:1px;background:#ffffff;transform-origin:0 100%;"></span>
                <span data-hud-arm="bl-v" style="position:absolute;left:0;bottom:0;width:1px;height:20px;background:#ffffff;transform-origin:0 100%;"></span>
                <span data-hud-arm="br-h" style="position:absolute;right:0;bottom:0;width:20px;height:1px;background:#ffffff;transform-origin:100% 100%;"></span>
                <span data-hud-arm="br-v" style="position:absolute;right:0;bottom:0;width:1px;height:20px;background:#ffffff;transform-origin:100% 100%;"></span>
              </div>
              </div>
              <div style="margin-top:22px;display:flex;flex-direction:column;gap:5px;font-size:16px;line-height:22px;color:#ffffff;">
                <sc-for list="{{ c.outcome.stats }}" as="s" hint-placeholder-count="3">
                  <div data-anim="1" style="display:flex;align-items:baseline;gap:2px;">
                    <span data-rv="1" data-scr="1">{{ s.k }}</span>
                    <span data-rv="1" style="flex:1;min-width:12px;height:2px;background-image:linear-gradient(90deg,#ffffff 0 1.7px,transparent 1.7px);background-size:3.92px 2px;background-repeat:repeat-x;"></span>
                    <span data-rv="1" data-scr="1">{{ s.v }}</span>
                  </div>
                </sc-for>
              </div>
              </div>
            </div>

            <div data-screen-label="Team" data-cs-box="1" data-cs-tree="1" style="position:relative;flex:1 1 300px;min-width:0;min-height:358px;padding:15px 16px 16px 15px;border:1px solid #929292;margin:0 -1px -1px 0;">
              <div data-anim="1" style="display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 6px;background:#ffffff;color:#000000;font-size:20px;line-height:1;white-space:nowrap;">
                <svg width="20" height="18" viewBox="47 123 20 18" fill="none" style="flex:0 0 auto;"><path d="M48 126V136.8C48 137.92 48 138.48 48.218 138.908C48.4097 139.284 48.7155 139.59 49.0918 139.782C49.5192 140 50.079 140 51.1969 140H62.8031C63.921 140 64.48 140 64.9074 139.782C65.2837 139.59 65.5905 139.284 65.7822 138.908C66.0002 138.48 66.0002 137.92 66.0002 136.8L66.0002 129.2C66.0002 128.08 66.0002 127.52 65.7822 127.092C65.5905 126.715 65.2839 126.41 64.9076 126.218C64.4798 126 63.9201 126 62.8 126H57M48 126H57M48 126C48 124.895 48.8954 124 50 124H53.6745C54.1637 124 54.4089 124 54.639 124.055C54.8431 124.104 55.0379 124.185 55.2168 124.295C55.4186 124.419 55.5918 124.592 55.9375 124.938L57 126" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <span>[Core] Team</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;padding-left:24px;margin-top:8px;">
                <sc-for list="{{ c.team }}" as="g" hint-placeholder-count="2">
                  <div style="display:flex;flex-direction:column;gap:8px;">
                    <div style="display:flex;"><div data-anim="1" style="display:inline-flex;align-items:flex-start;gap:10px;max-width:100%;min-height:34px;padding:4px 6px;border:1px solid #ffffff;font-size:20px;line-height:24px;">
                      <svg width="20" height="18" viewBox="47 123 20 18" fill="none" style="flex:0 0 auto;margin-top:3px;"><path d="M48 126V136.8C48 137.92 48 138.48 48.218 138.908C48.4097 139.284 48.7155 139.59 49.0918 139.782C49.5192 140 50.079 140 51.1969 140H62.8031C63.921 140 64.48 140 64.9074 139.782C65.2837 139.59 65.5905 139.284 65.7822 138.908C66.0002 138.48 66.0002 137.92 66.0002 136.8L66.0002 129.2C66.0002 128.08 66.0002 127.52 65.7822 127.092C65.5905 126.715 65.2839 126.41 64.9076 126.218C64.4798 126 63.9201 126 62.8 126H57M48 126H57M48 126C48 124.895 48.8954 124 50 124H53.6745C54.1637 124 54.4089 124 54.639 124.055C54.8431 124.104 55.0379 124.185 55.2168 124.295C55.4186 124.419 55.5918 124.592 55.9375 124.938L57 126" stroke="#eeeeee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                      <span>{{ g.label }}</span>
                    </div></div>
                    <div style="display:flex;flex-direction:column;gap:8px;padding-left:24px;">
                      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2">
                        <div style="position:relative;display:flex;">
                          <sc-if value="{{ it.full }}" hint-placeholder-val="{{ true }}"><span data-line="1" style="position:absolute;left:-12px;top:-8px;bottom:0;width:1px;background:#ffffff;transform-origin:50% 0;"></span></sc-if>
                          <sc-if value="{{ it.bridge }}" hint-placeholder-val="{{ false }}"><span data-line="1" style="position:absolute;left:-12px;top:-8px;bottom:-8px;width:1px;background:#ffffff;transform-origin:50% 0;"></span></sc-if>
                          <sc-if value="{{ it.end }}" hint-placeholder-val="{{ false }}"><span data-line="1" style="position:absolute;left:-12px;top:-8px;height:calc(50% + 9px);width:1px;background:#ffffff;transform-origin:50% 0;"></span></sc-if>
                          <span data-line="1" style="position:absolute;left:-12px;top:50%;width:12px;height:1px;background:#ffffff;transform-origin:0 50%;"></span>
                          <div data-anim="1" style="display:inline-flex;align-items:flex-start;gap:10px;max-width:100%;min-height:34px;padding:4px 6px;border:1px solid {{ it.stroke }};font-size:20px;line-height:24px;">
                            <svg width="20" height="18" viewBox="47 123 20 18" fill="none" style="flex:0 0 auto;margin-top:3px;"><path d="M48 126V136.8C48 137.92 48 138.48 48.218 138.908C48.4097 139.284 48.7155 139.59 49.0918 139.782C49.5192 140 50.079 140 51.1969 140H62.8031C63.921 140 64.48 140 64.9074 139.782C65.2837 139.59 65.5905 139.284 65.7822 138.908C66.0002 138.48 66.0002 137.92 66.0002 136.8L66.0002 129.2C66.0002 128.08 66.0002 127.52 65.7822 127.092C65.5905 126.715 65.2839 126.41 64.9076 126.218C64.4798 126 63.9201 126 62.8 126H57M48 126H57M48 126C48 124.895 48.8954 124 50 124H53.6745C54.1637 124 54.4089 124 54.639 124.055C54.8431 124.104 55.0379 124.185 55.2168 124.295C55.4186 124.419 55.5918 124.592 55.9375 124.938L57 126" stroke="#eeeeee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            <span>{{ it.t }}</span>
                          </div>
                        </div>
                      </sc-for>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>
        </div>

        <div data-screen-label="Case Visual" data-cs-box="1" style="position:relative;flex:1 1 560px;min-width:0;min-height:360px;border:1px solid #929292;margin:0 -1px -1px 0;"></div>
      </div>
      <div data-cs-frame="1" aria-hidden="true" style="position:absolute;inset:0;border:0.5px solid #ffffff;pointer-events:none;opacity:0;z-index:6;"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const WEALTHDESK = {
  title: 'Wealth Management for India\u2019s 1 Billion Retail Investors',
  tags: ['Fintech', 'B2B2C', '0 \u2192 1'],
  goals: [
    { label: 'Business Goals', items: ['Investment innovation via advisory and research licenses', 'Make advisory investment accessible for India\u2019s 1 Billion retail investors'] },
    { label: 'Product Goals', items: ['Build a wealth creation marketplace for investors, advisors and brokers', 'Build a suite of investment tools for vertical customer acquisition'] }
  ],
  outcome: { value: '$75Mn', caption: 'Acquisition post 18 months of 0\u21921', stats: [{ k: 'Product Verticals', v: '5+' }, { k: 'AUM', v: '$10Mn' }, { k: 'MAU', v: '100K' }] },
  team: [
    { label: 'My team', items: [{ t: '1 Lead Designer (Me)', me: true }, '1 Project Manager'] },
    { label: 'Client-side team', items: ['Founder + c suite exec', '3 Product Designers', '6 Full-stack Engineers'] }
  ]
};
// Cases 2–4 duplicate case 1 until their content is ready.
const CASES = [WEALTHDESK, WEALTHDESK, WEALTHDESK, WEALTHDESK];
const SCROLL_PER_CASE = 75; // vh of scroll per case study
const MAX_VH = 0.84; // card never taller than 84% of the viewport, and always clear of the nav bar

const tree = groups => groups.map((g, gi) => ({
  label: g.label,
  items: g.items.map((raw, ii) => {

const SHAPED = CASES.map(c => ({ ...c, goals: tree(c.goals), team: tree(c.team) }));

class Component extends DCLogic {
  state = { idx: 0, mobile: false };
  trackRef = React.createRef();

  track() {
    const t = this.trackRef.current;
    return t && t.isConnected ? t : document.querySelector('[data-cs-track]');
  }

  componentDidMount() {
    this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    this.mql.addEventListener('change', this.onMql);

  }

  // Section 2 → 3 handoff. Desktop: the hero writes window.__csReveal (true once the middle component's outline has grown
  // to this card's bounds). Otherwise the card forms when it scrolls into view. Forming is time-based, not scroll-scrubbed.
  watchReveal() {

  unform(card) {

  }
  form(card) {

    const EASE = 'cubic-bezier(.2,.75,.2,1)', frame = card.querySelector('[data-cs-frame]'), outc = card.querySelector('[data-cs-outcomes]');

       ['top:-' + w + ';bottom:-' + w + ';left:-' + w + ';width:' + w, 'scaleY(0)'], ['top:-' + w + ';bottom:-' + w + ';right:-' + w + ';width:' + w, 'scaleY(0)']].forEach(([pos, from]) => {
        const s = document.createElement('span'); s.setAttribute('data-cs-edge', '1');
        s.style.cssText = 'position:absolute;z-index:4;pointer-events:none;transform-origin:50% 50%;background:' + col + ';' + pos;

      onEnd: () => { card.querySelectorAll('[data-cs-edge]').forEach(e => e.remove()); boxes.forEach(b => (b.style.borderColor = '')); if (frame) frame.style.opacity = '0'; } });
    const T1 = 560;

    flick.forEach((e, k) => { e.style.opacity = '0'; H.flickerOn(eng, [e], { delay: T1 + 140 + k * 70, tag: 'cs' }); });

    //    in hard steps and its label types out
    const rows = [];
    card.querySelectorAll('[data-cs-tree] [data-anim]').forEach(el => rows.push({ el, top: el.getBoundingClientRect().top, left: el.getBoundingClientRect().left }));
    rows.sort((a, b) => a.top - b.top || a.left - b.left);

      const d = T1 + 220 + r.k * 120, wrap = r.el.parentElement;

      r.el.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], { duration: 240, delay: d, easing: 'steps(6, end)', fill: 'backwards' });

  componentDidUpdate() {

  }

  card(tr) { const c = this.cardEl; return c && c.isConnected ? c : (this.cardEl = tr && tr.querySelector('[data-cs-card]')); }

  update(refit) {
    const tr = this.track();
    if (!tr) return;
    const n = CASES.length;

      const nz = Math.max(0.45, Math.min(1, (z * target) / h));

      card.style.zoom = String(z);
      card.style.width = (100 / z) + '%';

  paintFill(idx, local) {

        { duration: 520, delay: k * 22, easing: ease, fill: 'backwards' });
    });

      const v = el.style.height === '1px' ? 'scaleX(0)' : 'scaleY(0)';
      el.animate([{ transform: v }, { transform: 'none' }], { duration: 480, delay: 80 + k * 18, easing: ease, fill: 'backwards' });
    });
