<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/* Fonts and the crtRoll keyframes live in index.html; re-declaring them here made every font re-download on mount. */
[data-cs-sq] > span:first-child{transition:opacity 160ms ease;}
[data-cs-sq]:focus-visible{outline:1px solid #df5227;outline-offset:3px;}
@media (hover: hover){ [data-cs-sq]:hover > span:first-child{opacity:0.6;} }
</style>
</helmet>
<div data-cs-track="1" ref="{{ trackRef }}" style="position:relative;height:{{ trackHeight }};">
  <div style="position:{{ stickyPos }};top:{{ stickyTop }};height:{{ stickyHeight }};display:flex;align-items:center;">
    <div data-cs-card="1" style="width:100%;display:flex;flex-direction:column;padding:0 1px 1px 0;color:#eeeeee;font-family:'Redaction 35','Redaction',Georgia,serif;">

      <div data-screen-label="Case Bar" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 25px;min-height:59px;padding:8px 16px 8px 17px;border:1px solid #929292;margin:0 -1px -1px 0;">
        <h2 data-anim="1" style="margin:0;min-width:0;font-family:'Redaction 10','Redaction',Georgia,serif;font-weight:400;font-size:28px;line-height:32px;letter-spacing:0;color:#ffffff;text-wrap:balance;">{{ c.title }}</h2>
        <div style="display:flex;gap:8px;">
          <sc-for list="{{ c.tags }}" as="t" hint-placeholder-count="3">
            <span data-anim="1" style="position:relative;display:flex;padding:2px;">
              <svg preserveAspectRatio="none" style="position:absolute;left:0.5px;top:0.5px;width:calc(100% - 1px);height:calc(100% - 1px);overflow:visible;"><rect x="0" y="0" width="100%" height="100%" fill="none" stroke="#df5227" stroke-width="1" pathLength="100" stroke-dasharray="20.4 1.8 16.5 3 31 2.3 18.1 2.4 4.5"></rect></svg>
              <span style="position:relative;overflow:hidden;display:flex;align-items:center;height:37px;padding:0 10px;background:#df5227;color:#ffffff;font-family:'Redaction 70','Redaction',Georgia,serif;font-weight:700;font-size:14px;line-height:1;white-space:nowrap;">
                <span style="position:relative;">{{ t }}</span>
                <span style="position:absolute;inset:0;background-image:url(assets/noise-dark.svg);background-size:200px 200px;opacity:0.35;pointer-events:none;"></span>
              </span>
            </span>
          </sc-for>
        </div>
        <div aria-label="Case studies" style="position:relative;margin-left:auto;display:flex;gap:4px;padding:2px;">
          <sc-for list="{{ squares }}" as="sq" hint-placeholder-count="4">
            <button type="button" data-cs-sq="1" aria-label="{{ sq.label }}" aria-current="{{ sq.on }}" onClick="{{ sq.go }}" style="position:relative;width:24px;height:24px;padding:0;border:0;background:transparent;cursor:pointer;overflow:hidden;">
              <span style="position:absolute;inset:0;background:#d9d9d9;opacity:0.3;"></span>
              <span data-fill="{{ sq.i }}" style="position:absolute;inset:0;background:#d9d9d9;transform-origin:0 50%;transform:scaleX(0);"></span>
              <span style="position:absolute;inset:0;background-image:url(assets/noise-dark.svg);background-size:200px 200px;opacity:0.35;"></span>
            </button>
          </sc-for>
          <span aria-hidden="true" style="position:absolute;left:2px;top:2px;width:24px;height:24px;pointer-events:none;transform:translateX({{ bracketX }});transition:transform 520ms cubic-bezier(.2,.8,.2,1);">
            <span style="position:absolute;left:-2px;top:-2px;width:8px;height:8px;border-top:1px solid #ffffff;border-left:1px solid #ffffff;"></span>
            <span style="position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-bottom:1px solid #ffffff;border-right:1px solid #ffffff;"></span>
          </span>
        </div>
      </div>

      <div style="display:flex;flex-wrap:wrap;">
        <div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;">

          <div data-screen-label="Goals" style="min-height:345px;padding:16px 16px 28px 15px;border:1px solid #929292;margin:0 -1px -1px 0;">

                <span aria-hidden="true" style="position:absolute;right:0;top:0;border-top:1px solid #ffffff;border-right:1px solid #ffffff;width:20px;height:20px;z-index:7;pointer-events:none;"></span>

                <svg width="20" height="18" viewBox="47 123 20 18" fill="none" style="flex:0 0 auto;"><path d="M48 126V136.8C48 137.92 48 138.48 48.218 138.908C48.4097 139.284 48.7155 139.59 49.0918 139.782C49.5192 140 50.079 140 51.1969 140H62.8031C63.921 140 64.48 140 64.9074 139.782C65.2837 139.59 65.5905 139.284 65.7822 138.908C66.0002 138.48 66.0002 137.92 66.0002 136.8L66.0002 129.2C66.0002 128.08 66.0002 127.52 65.7822 127.092C65.5905 126.715 65.2839 126.41 64.9076 126.218C64.4798 126 63.9201 126 62.8 126H57M48 126H57M48 126C48 124.895 48.8954 124 50 124H53.6745C54.1637 124 54.4089 124 54.639 124.055C54.8431 124.104 55.0379 124.185 55.2168 124.295C55.4186 124.419 55.5918 124.592 55.9375 124.938L57 126" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>

<script type="text/x-dc" data-dc-script>
const WEALTHDESK = {
  title: 'Wealth Management for India\u2019s 1 Billion Retail Investors',
  tags: ['Fintech', 'B2B2C', '0 \u2192 1'],
  goals: [
    { label: 'Business Goals', items: ['Investment innovation via advisory and research licenses', 'Make advisory investment accessible for India\u2019s 1 Billion retail investors'] },
    { label: 'Product Goals', items: ['Build a wealth creation marketplace for investors, advisors and brokers', 'Build a suite of investment tools for vertical customer acquisition'] }
  ],
  outcome: { value: '$75Mn', caption: 'Acquisition post 18 months of 0\u21921', stats: [{ k: 'Product Verticals', v: '5+' }, { k: 'AUM', v: '$10Mn' }, { k: 'MAU', v: '100K' }] },
  team: [
    { label: 'My team', items: [{ t: '1 Lead Designer (Me)', me: true }, '1 Project Manager'] },
    { label: 'Client-side team', items: ['Founder + c suite exec', '3 Product Designers', '6 Full-stack Engineers'] }
  ]
};
// Cases 2–4 duplicate case 1 until their content is ready.
const CASES = [WEALTHDESK, WEALTHDESK, WEALTHDESK, WEALTHDESK];
const SCROLL_PER_CASE = 75; // vh of scroll per case study
const MAX_VH = 0.9; // card never taller than 90% of the viewport

const tree = groups => groups.map((g, gi) => ({
  label: g.label,
  items: g.items.map((raw, ii) => {
    const it = typeof raw === 'string' ? { t: raw } : raw;
    const lastItem = ii === g.items.length - 1, lastGroup = gi === groups.length - 1;
    return { t: it.t, stroke: it.me ? '#df5227' : '#ffffff', full: !lastItem, bridge: lastItem && !lastGroup, end: lastItem && lastGroup };
  })
}));
const SHAPED = CASES.map(c => ({ ...c, goals: tree(c.goals), team: tree(c.team) }));

class Component extends DCLogic {
  state = { idx: 0, mobile: false };
  trackRef = React.createRef();

  track() {
    const t = this.trackRef.current;
    return t && t.isConnected ? t : document.querySelector('[data-cs-track]');
  }

  componentDidMount() {
    this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.mql = window.matchMedia('(max-width: 760px)');
    this.onMql = () => this.setState({ mobile: this.mql.matches }, () => this.update(true));
    this.mql.addEventListener('change', this.onMql);
    // Scroll work is batched to one pass per frame; fitting the card (which
    // forces layout) only happens when its size can actually have changed.
    this.onScroll = () => { this.lastY = window.scrollY; if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.update(this.needFit); }); };
    this.poll = setInterval(() => { if (!document.hidden && window.scrollY !== this.lastY) this.onScroll(); }, 90);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onResize = () => { this.z = 1; this.update(true); };
    window.addEventListener('resize', this.onResize);
    this.setState({ mobile: this.mql.matches }, () => this.update(true));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { this.z = 1; this.update(true); });
  }

  componentWillUnmount() {
    clearInterval(this.poll);
    cancelAnimationFrame(this.raf);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onResize);
    if (this.mql) this.mql.removeEventListener('change', this.onMql);
  }

  componentDidUpdate() {
    const idx = this.state.idx;
    if (this.shownIdx === undefined) { this.shownIdx = idx; return; }
    if (this.shownIdx !== idx) { this.shownIdx = idx; this.animateIn(); this.paintFill(idx, this.local || 0); this.needFit = true; this.onScroll(); }
  }

  update(refit) {
    const tr = this.track();
    if (!tr) return;
    const n = CASES.length;
    const card = tr.querySelector('[data-cs-card]');
    const vh = window.innerHeight;
    if (card && (refit || !this.fitted)) { this.fit(card, vh); this.fitted = true; this.needFit = false; }
    if (this.state.mobile) { this.local = 1; this.paintFill(this.state.idx, 1); return; }
    const ch = card ? card.getBoundingClientRect().height : vh;
    const top = Math.min(0, Math.round(vh - ch - 24));
    const stickH = Math.max(vh, ch + 48);
    const trackH = Math.round(stickH + n * vh * SCROLL_PER_CASE / 100);
    if (!this.state.geo || this.state.geo.top !== top || this.state.geo.trackH !== trackH) { this.setState({ geo: { top, trackH, stickH } }); }
    const dist = Math.max(1, trackH - stickH);
    const p = Math.min(dist, Math.max(0, top - tr.getBoundingClientRect().top));
    const per = dist / n;
    const idx = Math.min(n - 1, Math.floor(p / per));
    this.local = Math.min(1, (p - idx * per) / per);
    if (idx !== this.state.idx) this.setState({ idx });
    this.paintFill(idx, this.local);
  }

  // Scales the whole card (type included) so it never exceeds MAX_VH of the viewport.
  fit(card, vh) {
    const target = vh * MAX_VH;
    if (this.state.mobile) {
      card.style.zoom = ''; card.style.width = '';
      card.style.maxHeight = target + 'px'; card.style.overflowY = 'auto';
      this.z = 1; return;
    }
    card.style.maxHeight = ''; card.style.overflowY = '';
    let z = this.z || 1;
    for (let k = 0; k < 5; k++) {
      const h = card.getBoundingClientRect().height;
      const nz = Math.max(0.45, Math.min(1, (z * target) / h));
      if (Math.abs(nz - z) < 0.002 && h <= target + 1) break;
      z = nz;
      card.style.zoom = String(z);
      card.style.width = (100 / z) + '%';
    }
    this.z = z;
  }

  paintFill(idx, local) {
    const tr = this.track();
    if (!tr) return;
    tr.querySelectorAll('[data-fill]').forEach(el => {
      const i = +el.getAttribute('data-fill');
      const v = i < idx ? 1 : i === idx ? local : 0;
      el.style.transform = 'scaleX(' + v.toFixed(4) + ')';
    });
  }

  animateIn() {
    const tr = this.track();
    if (!tr || this.reduce || !tr.animate) return;
    const ease = 'cubic-bezier(.2,.75,.2,1)';
    // Transform + opacity only: they stay on the compositor, so swapping cases mid-scroll doesn't drop frames.
    // Any entrance still running from a fast scroll-through is cancelled first so they never stack.
    tr.querySelectorAll('[data-anim]').forEach((el, k) => {
      el.getAnimations().forEach(a => a.cancel());
      el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
        { duration: 520, delay: k * 22, easing: ease, fill: 'backwards' });
    });
    tr.querySelectorAll('[data-line]').forEach((el, k) => {
      el.getAnimations().forEach(a => a.cancel());
      const v = el.style.height === '1px' ? 'scaleX(0)' : 'scaleY(0)';
      el.animate([{ transform: v }, { transform: 'none' }], { duration: 480, delay: 80 + k * 18, easing: ease, fill: 'backwards' });
    });
  }

  goTo(i) {
    if (this.state.mobile) { this.setState({ idx: i }); return; }
    const tr = this.track();
    if (!tr) return;
    const g = this.state.geo || { top: 0, trackH: tr.offsetHeight, stickH: window.innerHeight };
    const dist = Math.max(1, g.trackH - g.stickH);
    const start = tr.getBoundingClientRect().top + window.scrollY - g.top;
    window.scrollTo({ top: start + (i * dist) / CASES.length + 2, behavior: this.reduce ? 'auto' : 'smooth' });
  }

  renderVals() {
    const { idx, mobile, geo } = this.state;
    const n = CASES.length;
    return {
      trackRef: this.trackRef,
      c: SHAPED[idx],
      trackHeight: mobile ? 'auto' : geo ? geo.trackH + 'px' : 'calc(100vh + ' + n * SCROLL_PER_CASE + 'vh)',
      stickyPos: mobile ? 'relative' : 'sticky',
      stickyHeight: mobile ? 'auto' : geo ? geo.stickH + 'px' : '100vh',
      stickyTop: mobile ? '0px' : geo ? geo.top + 'px' : '0px',
      bracketX: idx * 28 + 'px',
      squares: CASES.map((_, i) => ({ i, on: i === idx ? 'true' : 'false', label: 'Case study ' + (i + 1), go: () => this.goTo(i) }))
    };
  }
}
</script>
</body>
</html>
